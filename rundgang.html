<style>

  /* ---------- Zeichnen (Cover) mit Überblendung zwischen Nachbarbildern ---------- */
  let W = 0, H = 0, DPR = 1, dirty = true;
  function size() { DPR = Math.min(devicePixelRatio || 1, MOB ? 1.5 : 1.25); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); dirty = true; }
  addEventListener('resize', size); size();
  function cover() { const s = Math.max(W / IW, H / IH) * 1.04, dw = IW * s, dh = IH * s; return { dw, dh, ox: (W - dw) / 2 + px, oy: (H - dh) / 2 + py }; }
  function draw(f) {
    const i0 = Math.floor(f), a = f - i0; let A = near(i0, -1), B = near(Math.min(NF - 1, i0 + 1), 1);
    if (A < 0) A = B; if (B < 0) B = A; if (A < 0) return;
    const c = cover(); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.globalAlpha = 1; cx.drawImage(img[A], c.ox, c.oy, c.dw, c.dh);
    if (B !== A && a > .01) { cx.globalAlpha = a; cx.drawImage(img[B], c.ox, c.oy, c.dw, c.dh); cx.globalAlpha = 1; }
  }

  /* ---------- Hotspots ---------- */
  const dots = [];
  S.forEach((s, k) => (s.h || []).forEach(h => { const p = byId[h[2]]; if (!p) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'w3dot'; b.dataset.id = h[2]; b.dataset.k = k;
    b.innerHTML = `<i></i><span class="tip">${p.n}</span>`; b.setAttribute('aria-label', p.n); hsL.appendChild(b); dots.push({ b, k, x: h[0], y: h[1] }); }));
  function place(f, k, still) {
    const c = cover();
    for (const d of dots) {
      const on = still && d.k === k && Math.abs(f - S[k].f) < .6;
      const x = c.ox + d.x / 100 * c.dw, y = c.oy + d.y / 100 * c.dh;
      const vis = on && x > 14 && x < W - 14 && y > 90 && y < H - (MOB ? 150 : 110);
      d.b.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      d.b.classList.toggle('on', vis);
    }
  }

  /* ---------- Halte-Anzeige ---------- */
  let cur = -1;
  nav.innerHTML = S.map((s, k) => `<button type="button" data-k="${k}">${s.n}</button>`).join('');
  function setStop(k) {
    if (k === cur) return; cur = k; closeCard();
    const s = S[k]; nameEl.textContent = s.n; stepEl.textContent = `${k + 1} / ${N}`;
    nav.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === k));
    const ids = [...new Set((s.h || []).map(h => h[2]).filter(id => byId[id]))];
    row.innerHTML = ids.map((id, n) => `<button type="button" data-id="${id}" style="--i:${n}"><img src="${byId[id].im}" alt="" loading="lazy"><span>${byId[id].n}</span>${C.models[id] ? '<em>3D</em>' : ''}</button>`).join('');
    root.classList.remove('swap'); void root.offsetWidth; root.classList.add('swap');
  }
  nav.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) scrollTo({ top: stopY(+b.dataset.k), behavior: RM ? 'auto' : 'smooth' }); });

  /* ---------- Produktkarte + 3D ---------- */
  const ml = () => { try { return JSON.parse(localStorage.getItem('k-ml') || '{}'); } catch (e) { return {}; } };
  function closeCard() { card.hidden = true; root.querySelectorAll('.act').forEach(x => x.classList.remove('act')); }
  async function open3D(id) { const p = byId[id]; const { show3D } = await import('./' + C.base + 'w3v.js?v=' + C.v); show3D(C.models[id], { name: p.n, sub: (p.b ? p.b + ' · ' : '') + p.i, href: 'sortiment.html?p=' + encodeURIComponent(p.i) }); }
  function openCard(id, el) {
    const p = byId[id]; if (!p) return; closeCard(); const on = !!ml()[p.i], m3 = !!C.models[id];
    (el || hsL.querySelector(`[data-id="${CSS.escape(id)}"][data-k="${cur}"]`))?.classList.add('act');
    row.querySelector(`[data-id="${CSS.escape(id)}"]`)?.classList.add('act');
    card.innerHTML = `<button class="x" type="button" aria-label="Schließen">×</button><div class="ti"><img src="${p.im}" alt="${p.n}">${m3 ? '<button type="button" class="b3" data-3d="' + p.i + '">◎ 3D ansehen</button>' : ''}</div><div class="tb"><small translate="no">${p.b || ''} · ${p.i}</small><h3>${p.n}</h3>${p.sp ? `<p>${p.sp}</p>` : ''}<div class="tbtn"><a class="btn btn-primary" href="sortiment.html?p=${encodeURIComponent(p.i)}">Ansehen &amp; anfragen</a><button type="button" class="btn btn-ghost" data-ml="${p.i}">${on ? '✓ Gemerkt' : '+ Merken'}</button></div></div>`;
    card.hidden = false;
  }
  hsL.addEventListener('click', e => { const b = e.target.closest('.w3dot'); if (!b) return; e.stopPropagation(); b.classList.contains('act') ? closeCard() : openCard(b.dataset.id, b); });
  row.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) { e.stopPropagation(); openCard(b.dataset.id); } });
  card.addEventListener('click', e => {
    e.stopPropagation(); if (e.target.closest('.x')) { closeCard(); return; }
    const t3 = e.target.closest('[data-3d]'); if (t3) { open3D(t3.dataset['3d']); return; }
    const m = e.target.closest('[data-ml]'); if (m) { const o = ml(), i = m.dataset.ml; o[i] ? delete o[i] : o[i] = 1; try { localStorage.setItem('k-ml', JSON.stringify(o)); } catch (x) { } m.textContent = o[i] ? '✓ Gemerkt' : '+ Merken'; }
  });
  root.addEventListener('click', e => { if (!e.target.closest('button,a,.w3card')) closeCard(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

  /* ---------- leichte Parallaxe mit der Maus ---------- */
  let px = 0, py = 0, mx = 0, my = 0;
  addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; mx = -(e.clientX / innerWidth - .5) * 2; my = -(e.clientY / innerHeight - .5) * 2; });

  /* ---------- Schleife ---------- */
  let f = 0, last = performance.now(), lastDrawn = -1, visible = true;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }, { rootMargin: '200px' }).observe(track);
  function frame(now) {
    requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now; if (!visible) return;
    const T = target(); f += (T.f - f) * (1 - Math.exp(-dt * (RM ? 40 : 7))); if (Math.abs(T.f - f) < .002) f = T.f;
    const M = MOB || RM ? 0 : Math.min(W, H) * .012, opx = px, opy = py;
    px += (mx * M - px) * (1 - Math.exp(-dt * 3)); py += (my * M - py) * (1 - Math.exp(-dt * 3));
    if (dirty || Math.abs(f - lastDrawn) > .001 || Math.abs(px - opx) > .02 || Math.abs(py - opy) > .02) { draw(f); lastDrawn = f; dirty = false; }
    setStop(T.k); place(f, T.k, T.s); bar.style.transform = `scaleX(${(f / (NF - 1)).toFixed(4)})`;
    hint.classList.toggle('off', f > 3);
  }
  requestAnimationFrame(frame);
})();

</script>
</body></html>
