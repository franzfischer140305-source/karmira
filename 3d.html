<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>KARMIRA – Möbel in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b08;--ink:#f3f1ea;--muted:#a3a593;--gold:#cfa95a;--gold-l:#ebd39b;--gold-d:#9a7838;--line:rgba(236,226,196,.14);--f-display:"Marcellus",Georgia,serif;--f-body:"Manrope",system-ui,sans-serif;--f-mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
header{padding:28px clamp(16px,4vw,48px) 8px;max-width:1180px;margin:auto}
header small{font:500 11px var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-l)}
header h1{font:400 clamp(34px,5vw,60px)/1.05 var(--f-display);margin:10px 0 8px}header h1 em{font-style:italic;color:var(--gold-l)}
header p{color:var(--muted);max-width:620px;margin:0}
.grid{max-width:1180px;margin:24px auto 60px;padding:0 clamp(16px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.it{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0f120d;display:flex;flex-direction:column}
.it .im{background:#fff;aspect-ratio:4/3;display:grid;place-items:center}.it .im img{width:100%;height:100%;object-fit:contain}
.it .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.it small{font:500 10.5px var(--f-mono);letter-spacing:.14em;color:var(--gold-l);text-transform:uppercase}
.it h3{font:400 21px/1.2 var(--f-display);margin:0}.it p{margin:0;color:var(--muted);font-size:13px}
.b3d{margin-top:auto;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;padding:10px 16px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);font:600 13px var(--f-body);cursor:pointer}
.b3d:hover{background:var(--gold);color:#1b1608}
.btn{display:inline-flex;align-items:center;padding:11px 18px;border-radius:999px;font:600 14px var(--f-body);text-decoration:none}
.btn-primary{background:var(--gold);color:#1b1608}
/* Viewer */
.w3v{position:fixed;inset:0;z-index:100}.w3v[hidden]{display:none}
.w3vbg{position:absolute;inset:0;background:rgba(5,6,4,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:w3vf .3s}
.w3vwin{position:absolute;inset:clamp(10px,4vw,48px);border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#fbfaf7,#e7e3da 70%,#d8d2c6);box-shadow:0 40px 120px -30px #000;animation:w3vu .45s cubic-bezier(.2,.7,.2,1)}
@keyframes w3vf{from{opacity:0}}@keyframes w3vu{from{opacity:0;transform:translateY(24px) scale(.98)}}
.w3vwin canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}.w3vwin canvas:active{cursor:grabbing}
.w3vtop{position:absolute;left:24px;top:20px;color:#1d1c18;pointer-events:none}
.w3vtop small{font:500 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#8a6d2f}
.w3vtop b{display:block;font:400 clamp(22px,3vw,34px)/1.1 var(--f-display);margin-top:4px}
.w3vx{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.08);font-size:24px;cursor:pointer;color:#1d1c18}
.w3vhint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#6b6659;transition:opacity .5s;white-space:nowrap}
.w3v.used .w3vhint{opacity:0}
.w3vbtn{position:absolute;right:20px;bottom:18px}
.w3vload{position:absolute;inset:0;display:none;place-items:center}.w3v.loading .w3vload{display:grid}
.w3vload i{width:38px;height:38px;border-radius:50%;border:2px solid rgba(0,0,0,.12);border-top-color:#8a6d2f;animation:w3vs 1s linear infinite}@keyframes w3vs{to{transform:rotate(1turn)}}
@media(max-width:700px){.w3vhint{bottom:76px;font-size:10px}.w3vbtn{left:16px;right:16px;bottom:16px}.w3vbtn .btn{width:100%;justify-content:center}}
html.w3vopen{overflow:hidden}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body>
<header><small>Karmira · Vorschau</small><h1>Möbel in <em>3D</em></h1><p>Klicken Sie auf „In 3D ansehen“, dann können Sie das Möbelstück drehen und heranzoomen. Später öffnet sich diese Ansicht direkt aus dem Villa-Rundgang.</p></header>
<div class="grid" id="g"></div>
<script>window.K3M=[{"i": "SF-156", "n": "Lounge-Set, Zweisitzer 145 cm", "b": "ROMANTIC GARDEN", "im": "pi/rg-sf-156.webp", "sp": "Zweisitzer SF-156: 145 × 73 × 73 cm · Sessel SF-156: 72 × 72 × 73 cm · Tisch CJ-156: 100 × 55 × 40 cm", "m": [{"u": "m3d/sf156-sofa.glb", "w": 1.45, "p": [0, 0, -0.55]}, {"u": "m3d/sf156-sessel.glb", "w": 0.72, "p": [-1.25, 0, 0.25], "r": 0.75}, {"u": "m3d/sf156-sessel.glb", "w": 0.72, "p": [1.25, 0, 0.25], "r": -0.75}, {"u": "m3d/sf156-tisch.glb", "w": 1.0, "p": [0, 0, 0.45]}], "note": ""}, {"i": "TY-19", "n": "Sonnenliege", "b": "ROMANTIC GARDEN", "im": "pi/rg-ty-19.webp", "sp": "Liege TY-19", "m": [{"u": "m3d/ty19-liege.glb", "w": 1.95}], "note": ""}, {"i": "YZ-606+CT-D-521", "n": "Essgruppe, Tisch 180 × 90 cm", "b": "ROMANTIC GARDEN", "im": "pi/rg-yz-606-ct-d-521.webp", "sp": "Stuhl YZ-606: 63 × 58 × 75 cm · Esstisch CT-D-521: 180 × 90 × 75 cm", "m": [{"u": "m3d/yz606-stuhl.glb", "w": 0.6}], "note": "Stuhl aus der Essgruppe"}, {"i": "E3076", "n": "Bistrostuhl „Qia“", "b": "EASE CONTRACT", "im": "pi/ea-e3076.webp", "sp": "Maße (H × B × T): 85 × 45 × 57 cm", "m": [{"u": "m3d/e3076-bistrostuhl.glb", "w": 0.45}], "note": ""}, {"i": "E7073-WT1", "n": "Barhocker „Teddy“", "b": "EASE CONTRACT", "im": "pi/ea-e7073-wt1.webp", "sp": "Maße (H × B × T): 107 × 56 × 62 cm", "m": [{"u": "m3d/e7073-barhocker.glb", "w": 0.55}], "note": ""}];</script>
<script type="module">
/* KARMIRA 3D-Produktansicht: Möbel als scharfes 3D-Modell drehen und zoomen */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

let R, S, cam, ctl, box, cv, group, raf = 0, open = false, sun;
const gl = new GLTFLoader(), cache = {};

function setup() {
  box = document.createElement('div'); box.className = 'w3v'; box.hidden = true;
  box.innerHTML = `<div class="w3vbg"></div><div class="w3vwin"><canvas></canvas><div class="w3vload"><i></i></div>
    <div class="w3vtop"><small></small><b></b></div><button class="w3vx" type="button" aria-label="Schließen">×</button>
    <div class="w3vhint">Ziehen zum Drehen · Scrollen bzw. zwei Finger zum Zoomen</div><div class="w3vbtn"></div></div>`;
  document.body.appendChild(box);
  cv = box.querySelector('canvas');
  R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  S = new THREE.Scene();
  S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
  S.environmentIntensity = 0.9;
  sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(2.5, 4, 2); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0005;
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 12 });
  S.add(sun);
  const fl = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.ShadowMaterial({ opacity: 0.28 }));
  fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; S.add(fl);
  cam = new THREE.PerspectiveCamera(35, 1, 0.02, 60);
  ctl = new OrbitControls(cam, cv);
  Object.assign(ctl, { enableDamping: true, dampingFactor: 0.08, enablePan: false, autoRotate: true, autoRotateSpeed: 0.8, maxPolarAngle: Math.PI * 0.49, minPolarAngle: 0.15 });
  ctl.addEventListener('start', () => { ctl.autoRotate = false; box.classList.add('used'); });
  box.querySelector('.w3vx').onclick = close; box.querySelector('.w3vbg').onclick = close;
  addEventListener('keydown', e => { if (open && e.key === 'Escape') close(); });
  addEventListener('resize', () => open && size());
}
function size() { const w = cv.clientWidth, h = cv.clientHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
function loop() { raf = requestAnimationFrame(loop); ctl.update(); R.render(S, cam); }
async function part(p) {
  cache[p.u] = cache[p.u] || gl.loadAsync(p.u);
  const m = (await cache[p.u]).scene.clone(true);
  m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; if (o.material && o.material.map) o.material.map.anisotropy = 8; } });
  const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3()), k = p.w / Math.max(s.x, s.z);
  m.scale.setScalar(k); const b2 = new THREE.Box3().setFromObject(m), c = b2.getCenter(new THREE.Vector3());
  const g = new THREE.Group(); m.position.set(-c.x, -b2.min.y, -c.z); g.add(m);
  g.position.set(...(p.p || [0, 0, 0])); g.rotation.y = p.r || 0; return g;
}
export async function show3D(parts, info) {
  if (!R) setup();
  box.hidden = false; open = true; document.documentElement.classList.add('w3vopen');
  box.classList.remove('used'); box.classList.add('loading');
  box.querySelector('.w3vtop small').textContent = info.sub || ''; box.querySelector('.w3vtop b').textContent = info.name || '';
  box.querySelector('.w3vbtn').innerHTML = info.href ? `<a class="btn btn-primary" href="${info.href}">Ansehen &amp; anfragen</a>` : '';
  size(); cancelAnimationFrame(raf); loop();
  if (group) { S.remove(group); group = null; }
  try {
    const g = new THREE.Group(); (await Promise.all(parts.map(part))).forEach(x => g.add(x));
    group = g; S.add(g);
    const b = new THREE.Box3().setFromObject(g), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
    const d = Math.max(s.x, s.z, s.y * 1.6) * 1.9;
    ctl.target.set(c.x, s.y * 0.42, c.z); cam.position.set(c.x + d * 0.62, s.y * 0.42 + d * 0.42, c.z + d * 0.78);
    ctl.minDistance = d * 0.28; ctl.maxDistance = d * 2.2; ctl.autoRotate = true; ctl.update();
    sun.shadow.camera.left = sun.shadow.camera.bottom = -Math.max(s.x, s.z); sun.shadow.camera.right = sun.shadow.camera.top = Math.max(s.x, s.z); sun.shadow.camera.updateProjectionMatrix();
  } catch (e) { box.querySelector('.w3vtop small').textContent = '3D-Modell konnte nicht geladen werden'; }
  box.classList.remove('loading');
}
export function close() { if (!box) return; box.hidden = true; open = false; cancelAnimationFrame(raf); document.documentElement.classList.remove('w3vopen'); }

const g=document.getElementById('g');
g.innerHTML=K3M.map((p,i)=>`<div class="it"><div class="im"><img src="${p.im}" alt="" loading="lazy"></div><div class="tx"><small translate="no">${p.b} · ${p.i}</small><h3>${p.n}</h3>${p.note?`<p>${p.note}</p>`:''}<button class="b3d" data-i="${i}" type="button">◎ In 3D ansehen</button></div></div>`).join('');
g.addEventListener('click',e=>{const b=e.target.closest('.b3d');if(!b)return;const p=K3M[+b.dataset.i];show3D(p.m,{name:p.n,sub:(p.b?p.b+' · ':'')+p.i,href:'sortiment.html?p='+encodeURIComponent(p.i)})});
</script></body></html>
